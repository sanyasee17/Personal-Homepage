<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Homepage</title>
  <meta name="description" content="Ultra HD 4K start page with intelligent caching, live time, dynamic greetings, and instant search">
  <meta name="author" content="Sanyasee">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /*
    =====================================================
           ULTRA HD 4K START PAGE - CSS STYLES
    =====================================================
    
    Features:
    • Ultra HD 4K background images (3840×2160)
    • Intelligent caching system with 15-image memory
    • Real-time clock with dynamic greetings
    • Instant search functionality
    • Minimal navigation controls
    • Auto-background change every 5 minutes
    • Full responsive design
    • Elegant fade animations
    
    =====================================================
    */

    /* ===== GLOBAL FOUNDATION ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      user-select: none;
    }

    /* ===== BACKGROUND OVERLAY ===== */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      z-index: 1;
    }

    /* ===== MAIN CONTENT AREA ===== */
    .content {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 40px;
      text-align: center;
    }

    /* ===== TIME DISPLAY ===== */
    .clock {
      font-size: 8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      letter-spacing: -0.02em;
    }

    /* ===== GREETING MESSAGE ===== */
    .greeting {
      font-size: 1.5rem;
      font-weight: 300;
      margin-bottom: 3rem;
      opacity: 0.9;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    /* ===== SEARCH CONTAINER ===== */
    .search-container {
      width: 100%;
      max-width: 600px;
      margin-bottom: 2rem;
    }

    /* ===== SEARCH INPUT ===== */
    .search-box {
      width: 100%;
      padding: 8px 0;
      font-size: 1rem;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      color: white;
      outline: none;
      text-align: center;
    }

    .search-box::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .search-box:focus {
      border-bottom-color: white;
    }

    /* ===== NAVIGATION CONTROLS ===== */
    .controls {
      position: fixed;
      bottom: 30px;
      right: 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      z-index: 9999;
      pointer-events: auto;
    }

    .nav-button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      user-select: none;
      z-index: 10000;
      pointer-events: auto;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
      transition: transform 0.1s ease;
    }

    .nav-button:hover {
      transform: scale(1.2);
    }

    .nav-button:active {
      transform: scale(0.8);
    }

    .nav-button.clicked {
      transform: scale(0.9) !important;
    }

    /* ===== STATUS INDICATORS ===== */
    .loading {
      position: fixed;
      top: 20px;
      right: 20px;
      opacity: 0;
      display: none;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.15);
      padding: 10px 15px;
      border-radius: 25px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-weight: 500;
      z-index: 8888;
    }

    .loading.show {
      opacity: 1;
      display: block;
    }

    .photo-credit {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 0.8rem;
      opacity: 0.7;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 8888;
    }

    .cache-status {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 0.8rem;
      opacity: 0.7;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 8888;
    }

    .developer-credit {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      opacity: 0;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 12px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: opacity 0.3s ease;
      z-index: 8888;
      pointer-events: none;
    }

    .developer-credit.show {
      opacity: 0.8;
      pointer-events: auto;
    }

    .heart-icon {
      color: #ff6b6b;
      animation: heartbeat 2s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 50%, 100% { transform: scale(1); }
      25% { transform: scale(1.1); }
    }

    /* ===== ANIMATIONS ===== */
    .fade-bg {
      animation: fadeIn 2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ===== RESPONSIVE DESIGN ===== */
    @media (max-width: 768px) {
      .content {
        padding: 0 20px;
      }

      .clock {
        font-size: 6rem;
      }

      .greeting {
        font-size: 1.2rem;
      }

      .search-box {
        padding: 8px 0;
        font-size: 1rem;
      }

      .controls {
        bottom: 20px;
        right: 20px;
        gap: 10px;
      }

      .nav-button {
        font-size: 12px;
        padding: 3px;
      }

      .loading {
        font-size: 0.8rem;
        padding: 8px 12px;
      }

      .photo-credit,
      .cache-status {
        font-size: 0.7rem;
        padding: 6px 10px;
      }
    }

    @media (max-width: 480px) {
      .clock {
        font-size: 5rem;
      }

      .greeting {
        font-size: 1rem;
        margin-bottom: 2rem;
      }

      .search-container {
        margin-bottom: 1.5rem;
      }

      .controls {
        bottom: 15px;
        right: 15px;
        gap: 8px;
      }
    }

    /* ===== PERFORMANCE OPTIMIZATIONS ===== */
    .nav-button,
    .search-box,
    .loading,
    .photo-credit,
    .cache-status,
    .developer-credit {
      will-change: transform, opacity;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  
  <!-- Main Content Area -->
  <div class="content">
    <div class="clock" id="clock">12:00:00 PM</div>
    <div class="greeting" id="greeting">Good day!</div>
    <div class="search-container">
      <input type="text" class="search-box" id="searchBox" placeholder="Type to search" autocomplete="off">
    </div>
  </div>

  <!-- Navigation Controls -->
  <div class="controls">
    <button class="nav-button" id="prevBtn" title="Previous Image" onclick="handlePrevClick()">←</button>
    <button class="nav-button" id="playPauseBtn" title="Pause Auto-change" onclick="handlePlayPauseClick()">⏸</button>
    <button class="nav-button" id="nextBtn" title="Next Image" onclick="handleNextClick()">→</button>
  </div>

  <!-- Status Indicators -->
  <div class="loading" id="loading">🎨 Loading stunning wallpaper...</div>
  <div class="photo-credit" id="photoCredit">📸 Beautiful photography</div>
  <div class="cache-status" id="cacheStatus">🚀 Turbo Mode</div>
  <div class="developer-credit" id="developerCredit">Made with <span class="heart-icon">❤️</span> by Sanyasee</div>

  <script>
    /**
     * =====================================================
     *           ULTRA HD 4K START PAGE - JAVASCRIPT
     * =====================================================
     * 
     * A premium homepage experience featuring:
     * 
     * 🎨 VISUAL FEATURES:
     * • Ultra HD 4K backgrounds (3840×2160 resolution)
     * • Smooth fade transitions between images
     * • Real-time digital clock with millisecond precision
     * • Dynamic greeting messages based on time of day
     * • Minimalist navigation controls
     * • Elegant loading indicators
     * 
     * ⚡ PERFORMANCE FEATURES:
     * • Intelligent image caching with LRU cleanup
     * • Preloading system for instant image switches
     * • Multiple API fallbacks for reliability
     * • localStorage for user preferences
     * • Optimized memory management
     * 
     * 🔧 TECHNICAL FEATURES:
     * • Auto-background change every 5 minutes
     * • Search functionality with instant redirect
     * • Responsive design for all devices
     * • Error handling with graceful fallbacks
     * • Visit counter with developer credits
     * 
     * 📱 COMPATIBILITY:
     * • Modern browsers (Chrome 60+, Firefox 55+, Safari 12+)
     * • Mobile and desktop responsive
     * • Touch and keyboard navigation
     * 
     * =====================================================
     */

    // ===== GLOBAL CONFIGURATION =====
    
    /**
     * Ultra HD 4K image sources with fallback redundancy
     */
    const IMAGE_SOURCES = [
      { 
        name: 'Pexels 4K', 
        url: 'https://images.pexels.com/photos/{id}/pexels-photo-{id}.jpeg?auto=compress&cs=tinysrgb&w=3840&h=2160&fit=crop',
        ids: Array.from({length: 50}, (_, i) => 1000000 + Math.floor(Math.random() * 5000000))
      },
      { 
        name: 'Picsum 4K', 
        url: 'https://picsum.photos/3840/2160?random={id}',
        ids: Array.from({length: 50}, (_, i) => i + 1)
      },
      { 
        name: 'Unsplash 4K', 
        url: 'https://source.unsplash.com/3840x2160/?nature,landscape&{id}',
        ids: Array.from({length: 50}, (_, i) => i + 100)
      }
    ];

    /**
     * Application state variables
     */
    let currentImageIndex = Math.floor(Math.random() * 50);
    let autoChangeInterval = null;
    let isAutoChangeActive = true;
    let loadingAttempts = 0;
    let currentSourceIndex = 0;

    /**
     * Intelligent caching system with LRU cleanup
     */
    const imageCache = new Map();
    const MAX_CACHE_SIZE = 15;

    // ===== UTILITY FUNCTIONS =====

    /**
     * Updates the digital clock display with current time
     * Formats time in 12-hour format with AM/PM
     */
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('en-US', { 
        hour12: true,
        hour: 'numeric',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('clock').textContent = timeString;
    }

    /**
     * Updates greeting message based on current time of day
     * Provides personalized welcome messages
     */
    function updateGreeting() {
      const hour = new Date().getHours();
      let greeting;
      
      if (hour < 6) greeting = 'Good night';
      else if (hour < 12) greeting = 'Good morning';
      else if (hour < 17) greeting = 'Good afternoon';
      else if (hour < 21) greeting = 'Good evening';
      else greeting = 'Good night';
      
      document.getElementById('greeting').textContent = `${greeting}, Sanyasee`;
    }

    /**
     * Handles search functionality with instant redirect
     * @param {string} query - Search query string
     */
    function handleSearch(query) {
      const trimmedQuery = query.trim();
      if (!trimmedQuery) return;
      
      const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(trimmedQuery)}`;
      window.location.href = searchUrl;
    }

    // ===== NAVIGATION HANDLERS =====

    /**
     * Handles next image button click
     * Provides visual feedback and loads next background
     */
    function handleNextClick() {
      const btn = document.getElementById('nextBtn');
      if (btn) {
        btn.classList.add('clicked');
        setTimeout(() => btn.classList.remove('clicked'), 150);
      }
      
      hideLoadingIndicator();
      if (typeof setRandomBackground === 'function') {
        setRandomBackground('next');
      }
    }

    /**
     * Handles previous image button click
     * Provides visual feedback and loads previous background
     */
    function handlePrevClick() {
      const btn = document.getElementById('prevBtn');
      if (btn) {
        btn.classList.add('clicked');
        setTimeout(() => btn.classList.remove('clicked'), 150);
      }
      
      hideLoadingIndicator();
      if (typeof setRandomBackground === 'function') {
        setRandomBackground('prev');
      }
    }

    /**
     * Handles play/pause button toggle
     * Controls automatic background changing
     */
    function handlePlayPauseClick() {
      const btn = document.getElementById('playPauseBtn');
      if (btn) {
        btn.classList.add('clicked');
        setTimeout(() => btn.classList.remove('clicked'), 150);
      }
      
      if (typeof toggleAutoChange === 'function') {
        toggleAutoChange();
      }
    }

    // ===== LOADING INDICATOR MANAGEMENT =====

    /**
     * Hides loading indicator with smooth animation
     */
    function hideLoadingIndicator() {
      const loadingElement = document.getElementById('loading');
      if (loadingElement) {
        loadingElement.classList.remove('show');
        loadingElement.style.display = 'none';
        setTimeout(() => {
          if (loadingElement.parentNode) {
            loadingElement.parentNode.removeChild(loadingElement);
          }
        }, 300);
      }
    }

    /**
     * Disables loading indicator completely
     */
    function disableLoadingIndicator() {
      const loadingElement = document.getElementById('loading');
      if (loadingElement) {
        loadingElement.style.display = 'none';
        loadingElement.classList.remove('show');
      }
    }

    // ===== PREFERENCES MANAGEMENT =====

    /**
     * Loads user preferences from localStorage
     * Includes visit tracking and settings persistence
     */
    function loadPreferences() {
      try {
        const preferences = localStorage.getItem('startPagePreferences');
        if (preferences) {
          const parsed = JSON.parse(preferences);
          currentImageIndex = parsed.currentImageIndex || 0;
          isAutoChangeActive = parsed.isAutoChangeActive !== undefined ? parsed.isAutoChangeActive : true;
          
          const visitCount = (parsed.visitCount || 0) + 1;
          const newVisitCount = visitCount;
          
          localStorage.setItem('startPagePreferences', JSON.stringify({
            ...parsed,
            visitCount: newVisitCount,
            lastVisit: Date.now()
          }));
        }
      } catch (error) {
        // Continue with defaults if localStorage is unavailable
      }
    }

    /**
     * Saves current preferences to localStorage
     */
    function savePreferences() {
      try {
        const currentPrefs = JSON.parse(localStorage.getItem('startPagePreferences') || '{}');
        localStorage.setItem('startPagePreferences', JSON.stringify({
          ...currentPrefs,
          currentImageIndex,
          isAutoChangeActive,
          lastSaved: Date.now()
        }));
      } catch (error) {
        // Fail silently if localStorage is unavailable
      }
    }

    // ===== IMAGE CACHING SYSTEM =====

    /**
     * Intelligent caching system with LRU cleanup
     * @param {string} cacheKey - Unique identifier for cached image
     * @returns {Object|null} - Cached image data or null
     */
    function getCachedImage(cacheKey) {
      const cached = imageCache.get(cacheKey);
      if (cached) {
        // Move to end (most recently used)
        imageCache.delete(cacheKey);
        imageCache.set(cacheKey, cached);
        return cached;
      }
      return null;
    }

    /**
     * Adds image to cache with LRU cleanup
     * @param {string} cacheKey - Unique identifier
     * @param {string} imageUrl - Image URL
     * @param {string} resolution - Image resolution info
     */
    function setCachedImage(cacheKey, imageUrl, resolution) {
      // Remove oldest entries if cache is full
      if (imageCache.size >= MAX_CACHE_SIZE) {
        const oldestKey = imageCache.keys().next().value;
        imageCache.delete(oldestKey);
      }
      
      const cacheEntry = {
        url: imageUrl,
        resolution: resolution,
        cachedAt: Date.now()
      };
      
      imageCache.set(cacheKey, cacheEntry);
    }

    /**
     * Preloads images for smooth transitions
     * @param {number} centerIndex - Current image index
     */
    async function preloadImages(centerIndex) {
      const preloadPromises = [];
      
      // Preload 5 images around current index
      for (let offset = -2; offset <= 2; offset++) {
        const index = (centerIndex + offset + 50) % 50;
        
        IMAGE_SOURCES.forEach((source, sourceIndex) => {
          const imageId = source.ids[index];
          const imageUrl = source.url.replace('{id}', imageId);
          const cacheKey = `${sourceIndex}-${index}`;
          
          if (!getCachedImage(cacheKey)) {
            const preloadPromise = preloadImage(imageUrl)
              .then(url => setCachedImage(cacheKey, url, '4K Ultra HD'))
              .catch(err => {
                // Silent fail for preloading
              });
            preloadPromises.push(preloadPromise);
          }
        });
      }
      
      try {
        await Promise.allSettled(preloadPromises);
      } catch (error) {
        // Continue even if preloading fails
      }
    }

    /**
     * Preloads a single image
     * @param {string} imageUrl - URL to preload
     * @returns {Promise<string>} - Promise resolving to image URL
     */
    function preloadImage(imageUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const timeout = setTimeout(() => {
          reject(new Error('Preload timeout'));
        }, 8000);
        
        img.onload = () => {
          clearTimeout(timeout);
          resolve(imageUrl);
        };
        
        img.onerror = () => {
          clearTimeout(timeout);
          reject(new Error('Preload failed'));
        };
        
        img.src = imageUrl;
      });
    }

    /**
     * Shows loading indicator with timeout protection
     */
    function showLoadingIndicator() {
      const loadingElement = document.getElementById('loading');
      if (loadingElement) {
        loadingElement.style.display = 'block';
        loadingElement.classList.add('show');
        
        // Auto-hide after 8 seconds
        setTimeout(() => {
          hideLoadingIndicator();
        }, 8000);
      }
    }

    // ===== BACKGROUND MANAGEMENT =====

    /**
     * Sets random background with intelligent caching
     * @param {string} direction - 'next', 'prev', or 'random'
     */
    async function setRandomBackground(direction = 'random') {
      // Update image index based on direction
      if (direction === 'next') {
        currentImageIndex = (currentImageIndex + 1) % 50;
      } else if (direction === 'prev') {
        currentImageIndex = currentImageIndex === 0 ? 49 : currentImageIndex - 1;
      } else {
        currentImageIndex = Math.floor(Math.random() * 50);
      }
      
      // Try cache first
      for (let sourceIndex = 0; sourceIndex < IMAGE_SOURCES.length; sourceIndex++) {
        const cacheKey = `${sourceIndex}-${currentImageIndex}`;
        const cached = getCachedImage(cacheKey);
        
        if (cached) {
          // Instant load from cache
          document.body.style.backgroundImage = `url('${cached.url}')`;
          document.body.style.backgroundSize = 'cover';
          document.body.style.backgroundPosition = 'center';
          document.body.style.backgroundRepeat = 'no-repeat';
          document.body.classList.add('fade-bg');
          
          setTimeout(() => document.body.classList.remove('fade-bg'), 2000);
          
          // Update status
          document.getElementById('photoCredit').textContent = `📸 ${cached.resolution} Ultra HD`;
          
          // Preload around current position
          preloadImages(currentImageIndex);
          savePreferences();
          return;
        }
      }
      
      // Load new image if not cached
      showLoadingIndicator();
      loadingAttempts = 0;
      
      await tryLoadBackground();
      hideLoadingIndicator();
    }

    /**
     * Attempts to load background with fallback sources
     */
    async function tryLoadBackground() {
      const maxAttempts = 3;
      
      while (loadingAttempts < maxAttempts && currentSourceIndex < IMAGE_SOURCES.length) {
        try {
          loadingAttempts++;
          const selectedSource = IMAGE_SOURCES[currentSourceIndex];
          const imageId = selectedSource.ids[currentImageIndex];
          const imageUrl = selectedSource.url.replace('{id}', imageId);
          
          // Test load the image
          await preloadImage(imageUrl);
          
          // Apply background
          document.body.style.backgroundImage = `url('${imageUrl}')`;
          document.body.style.backgroundSize = 'cover';
          document.body.style.backgroundPosition = 'center';
          document.body.style.backgroundRepeat = 'no-repeat';
          document.body.classList.add('fade-bg');
          
          // Cache the successful load
          const cacheKey = `${currentSourceIndex}-${currentImageIndex}`;
          setCachedImage(cacheKey, imageUrl, '4K Ultra HD');
          
          // Update UI
          document.getElementById('photoCredit').textContent = `📸 4K Ultra HD`;
          
          setTimeout(() => document.body.classList.remove('fade-bg'), 2000);
          
          // Preload around current position
          preloadImages(currentImageIndex);
          savePreferences();
          return;
          
        } catch (error) {
          // Try next source
          currentSourceIndex = (currentSourceIndex + 1) % IMAGE_SOURCES.length;
        }
      }
      
      // All sources failed - use gradient fallback
      if (loadingAttempts >= maxAttempts) {
        const gradients = [
          'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
          'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
          'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
          'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
          'linear-gradient(135deg, #fa709a 0%, #fee140 100%)'
        ];
        
        const randomGradient = gradients[Math.floor(Math.random() * gradients.length)];
        document.body.style.backgroundImage = randomGradient;
        document.getElementById('photoCredit').textContent = '🎨 Beautiful gradient';
        
        loadingAttempts = 0;
        currentSourceIndex = 0;
      }
    }

    // ===== AUTO-CHANGE FUNCTIONALITY =====

    /**
     * Starts automatic background changing every 5 minutes
     */
    function startAutoChange() {
      if (autoChangeInterval) clearInterval(autoChangeInterval);
      autoChangeInterval = setInterval(setRandomBackground, 300000); // 5 minutes
      isAutoChangeActive = true;
      document.getElementById('playPauseBtn').textContent = '⏸';
      document.getElementById('playPauseBtn').title = 'Pause Auto-change';
    }

    /**
     * Stops automatic background changing
     */
    function stopAutoChange() {
      if (autoChangeInterval) {
        clearInterval(autoChangeInterval);
        autoChangeInterval = null;
      }
      isAutoChangeActive = false;
      document.getElementById('playPauseBtn').textContent = '▶';
      document.getElementById('playPauseBtn').title = 'Resume Auto-change';
    }

    /**
     * Toggles auto-change functionality
     */
    function toggleAutoChange() {
      if (isAutoChangeActive) {
        stopAutoChange();
      } else {
        startAutoChange();
      }
      savePreferences();
    }

    // ===== DEVELOPER CREDIT SYSTEM =====

    /**
     * Shows developer credit with elegant timing
     * @param {number} delay - Delay before showing in milliseconds
     */
    function showDeveloperCredit(delay = 0) {
      setTimeout(() => {
        const creditElement = document.getElementById('developerCredit');
        if (creditElement) {
          creditElement.classList.add('show');
          
          // Auto-hide after 5 seconds unless hovering
          setTimeout(() => {
            if (!creditElement.matches(':hover')) {
              creditElement.classList.remove('show');
            }
          }, 5000);
        }
      }, delay);
    }

    // ===== APPLICATION INITIALIZATION =====

    /**
     * Initializes the complete application
     */
    async function startApp() {
      try {
        // Load user preferences and settings
        loadPreferences();
        
        // Start real-time clock updates
        updateClock();
        setInterval(updateClock, 1000);
        
        // Update greeting message
        updateGreeting();
        
        // Set initial background
        await setRandomBackground();
        
        // Start auto-change if enabled
        if (isAutoChangeActive) {
          startAutoChange();
        }
        
        // Auto-focus search box for immediate use
        setTimeout(() => {
          const searchBox = document.getElementById('searchBox');
          if (searchBox) {
            searchBox.focus();
          }
        }, 1000);
        
        // Set up search functionality
        document.getElementById('searchBox').addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            handleSearch(this.value);
            this.value = '';
          }
        });
        
        // Show developer credit on special occasions
        const preferences = JSON.parse(localStorage.getItem('startPagePreferences') || '{}');
        const visitCount = preferences.visitCount || 1;
        
        if (visitCount === 1 || visitCount % 10 === 0 || Math.random() < 0.1) {
          showDeveloperCredit(3000);
        }
        
        // Remove loading state
        document.body.classList.remove('loading');
        
      } catch (error) {
        console.error('Initialization failed:', error);
        document.body.classList.remove('loading');
      }
    }

    // ===== APPLICATION STARTUP =====

    // Start when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', startApp);
    } else {
      startApp();
    }

    // Safety cleanup after page load
    window.addEventListener('load', () => {
      setTimeout(() => {
        disableLoadingIndicator();
      }, 3000);
      
      // Backup search box focus
      setTimeout(() => {
        const searchBox = document.getElementById('searchBox');
        if (searchBox && document.activeElement !== searchBox) {
          searchBox.focus();
        }
      }, 1500);
    });
  </script>
</body>
</html>
